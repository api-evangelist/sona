name: Sona
description: >-
  Sona is an AI-powered workforce management platform for large, multi-site
  organizations in hospitality, hotels, care, retail, and logistics. It unifies
  labor demand forecasting, autonomous staff scheduling, core HR (onboarding,
  absence, training), and payroll automation, with a Raffy AI assistant that
  guides manager decisions plus real-time analytics across locations. Sona ships
  95+ pre-built integrations (ATS, POS, LMS, tipping, earned-wage-access, and
  care-planning systems) and advertises a private API for building bespoke
  integrations, though it publishes no public developer portal, API reference,
  or OpenAPI at this time. Added to the API Evangelist network as a VC-portfolio
  lead (Northzone, Polychain, Speedinvest) and enriched via the local pipeline.
